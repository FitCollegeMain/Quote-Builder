<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIT College - Course Preferences</title>
    <style>
        :root {
            --fit-red: #D31118;
            --fit-black: #000000;
            --fit-gray: #f4f4f4;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ececec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .survey-container {
            background: white;
            max-width: 500px;
            width: 100%;
            margin: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: var(--fit-black);
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--fit-red);
        }
        .header img {
            max-width: 150px;
            filter: invert(1);
        }
        .content {
            padding: 30px;
        }
        .content h2 {
            margin-top: 0;
            color: var(--fit-red);
            text-transform: uppercase;
            font-size: 18pt;
        }
        .content p {
            color: #555;
            font-size: 11pt;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--fit-black);
            font-size: 10pt;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11pt;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--fit-red);
            box-shadow: 0 0 5px rgba(211, 17, 24, 0.2);
        }
        .submit-btn {
            background-color: var(--fit-red);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 12pt;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .submit-btn:hover {
            background-color: #a80d13;
        }
    </style>
</head>
<body>

<div class="survey-container">
    <div class="header">
        <img src="https://www.fitcollege.edu.au/assets/images/logo-black.png" alt="FIT College Logo">
    </div>
    <div class="content">
        <h2>Tell us what you're looking for</h2>
        <p>We noticed we missed you on the phone! To help our Career Advisers point you in the right direction, let us know what you are most interested in below.</p>
        
        <form action="https://formspree.io/f/YOUR_FORMSPREE_ENDPOINT" method="POST">
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="Name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="Email" required placeholder="john@email.com">
            </div>

            <div class="form-group">
                <label for="course">Which course are you most interested in?</label>
                <select id="course" name="Course Preference" required>
                    <option value="" disabled selected>-- Select a Course --</option>
                    <option value="FIT Elite Personal Trainer Program">FIT Elite Personal Trainer Program</option>
                    <option value="Certificate III in Fitness">Certificate III in Fitness</option>
                    <option value="Certificate IV in Fitness">Certificate IV in Fitness</option>
                    <option value="Diploma of Sport - Coaching">Diploma of Sport - Coaching</option>
                    <option value="Strength & Conditioning (ASCA L1)">Strength & Conditioning (ASCA L1)</option>
                    <option value="Individual Support - Disability">Individual Support - Disability</option>
                    <option value="First Aid & CPR">First Aid & CPR</option>
                    <option value="Short Courses (Kettlebell, Rumble, etc.)">Short Courses</option>
                    <option value="Undecided / Need Advice">I'm not sure yet!</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mode">Preferred Study Mode</label>
                <select id="mode" name="Study Mode Preference" required>
                    <option value="" disabled selected>-- Select Study Mode --</option>
                    <option value="On Campus (Face to Face)">On Campus (Face to Face)</option>
                    <option value="Online (Flexible)">Online (Flexible)</option>
                    <option value="Blended">Blended</option>
                </select>
            </div>

            <div class="form-group">
                <label for="callback">When is the best time for an Adviser to call you?</label>
                <select id="callback" name="Best Callback Time">
                    <option value="Morning (9am - 12pm)">Morning (9am - 12pm)</option>
                    <option value="Afternoon (12pm - 3pm)">Afternoon (12pm - 3pm)</option>
                    <option value="Late Afternoon (3pm - 5pm)">Late Afternoon (3pm - 5pm)</option>
                    <option value="Email/Text me first">Please Email/Text me first</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Send My Preferences</button>
            
            <input type="hidden" name="_next" value="https://www.fitcollege.edu.au/">
        </form>
    </div>
</div>

</body>
</html>
