<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FIT College Quote Generator</title>
    <style>
        :root {
            --fit-red: #D31118;
            --fit-black: #000000;
            --fit-gray: #f4f4f4;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #222;
            font-size: 11pt;
            background-color: #ececec;
        }
        .page-container {
            max-width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: white;
            padding: 15mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .content-wrapper {
            position: relative;
            z-index: 1;
        }
        .no-print {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--fit-red);
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background-color: #a80d13;
        }
        .header {
            background-color: var(--fit-black);
            color: #ffffff;
            padding: 20px 25px;
            border-bottom: 6px solid var(--fit-red);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-text {
            text-align: left;
        }
        .header-text h1 {
            margin: 0;
            font-size: 26pt;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
        .header-text h2 {
            margin: 5px 0 0 0;
            color: var(--fit-red);
            font-weight: 600;
            font-size: 12pt;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header img {
            max-width: 140px;
            max-height: 75px;
            object-fit: contain;
            filter: invert(1);
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            margin-bottom: 8px;
            align-items: center;
        }
        .input-group label {
            width: 140px;
            font-weight: bold;
            color: #555;
            font-size: 10pt;
        }
        .input-group input, .input-group select {
            flex: 1;
            border: none;
            border-bottom: 1px solid #ccc;
            font-family: inherit;
            font-size: 10pt;
            padding: 4px;
            background: transparent;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-bottom: 2px solid var(--fit-red);
        }
        
        .pathway-container {
            margin-bottom: 30px;
        }
        
        h3.pathway-title {
            color: var(--fit-red);
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 14pt;
            text-transform: uppercase;
        }
        
        .info-block {
            background:#f9f9f9; 
            padding: 12px 15px; 
            margin-bottom: 15px; 
            border-left: 4px solid var(--fit-red); 
            font-size: 9.5pt;
        }
        .info-block .inline-field {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .info-block .inline-field label {
            font-weight: bold;
            color: #555;
            margin-right: 10px;
            width: 110px;
        }
        .info-block select, .info-block input[type="date"] {
            border: 1px solid #ccc;
            padding: 4px;
            font-family: inherit;
            font-size: 9.5pt;
            background: white;
            border-radius: 3px;
        }
        .timetable-desc {
            color: var(--fit-red);
            font-weight: bold;
            margin-left: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 9pt;
        }
        th, td {
            border: 1px solid #dddddd;
            padding: 6px;
            text-align: left;
            vertical-align: middle;
        }
        th {
            background-color: var(--fit-black);
            color: white;
            text-transform: uppercase;
        }
        td input, td select {
            width: 100%;
            border: 1px solid #eee;
            padding: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 9pt;
        }
        td input.num-input {
            text-align: right;
        }
        tr.included-row td {
            background-color: #f0f0f0;
            color: #777;
        }
        tr.included-row input, tr.included-row select {
            background-color: transparent;
            color: #777;
            pointer-events: none;
            border: none;
        }
        .disc-wrapper {
            display: flex;
            align-items: center;
        }
        .disc-wrapper input {
            flex: 1;
            text-align: right;
            border-right: none;
            min-width: 60px;
        }
        .disc-wrapper select {
            width: 45px;
            border-left: none;
            padding-left: 2px;
            padding-right: 2px;
            background-color: #f9f9f9;
            cursor: pointer;
        }
        .totals-row td {
            font-weight: bold;
            background-color: #fafafa;
        }
        .totals-label {
            text-align: right;
        }
        .final-total {
            color: var(--fit-red);
            font-size: 12pt;
        }
        .delete-btn {
            background-color: #ccc;
            padding: 4px 8px;
            font-size: 11px;
            color: black;
            border-radius: 3px;
        }
        .table-controls {
            text-align: right;
            margin-bottom: 20px;
        }
        
        .info-box {
            background-color: #f9f9f9;
            border-left: 4px solid var(--fit-red);
            padding: 15px 20px;
            margin: 20px 0;
            font-size: 9.5pt;
        }
        .info-box h4 {
            margin: 0 0 10px 0;
            color: #000;
            font-size: 11pt;
            text-transform: uppercase;
        }
        .info-box ul {
            margin: 0;
            padding-left: 20px;
        }
        .footer-text {
            text-align: center;
            font-size: 9pt;
            color: #666;
            margin-top: 40px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .contact-info {
            font-weight: bold;
            color: #000;
        }
        
        @media print {
            body { background-color: white; padding: 0; }
            .page-container { box-shadow: none; padding: 0; max-width: 100%; }
            .no-print { display: none !important; }
            input, select { border: none !important; appearance: none; background: transparent; -webkit-appearance: none; }
            .input-group input, .input-group select { border-bottom: 1px solid #ccc !important; }
            .info-block select, .info-block input[type="date"] { border: none !important; padding: 0; font-weight: bold; appearance: none; -webkit-appearance: none; background: transparent; }
            td input, td select { border: none !important; padding: 0; }
            .disc-wrapper select { display: none; }
            th:last-child, td:last-child { display: none; }
            @page { margin: 15mm; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button onclick="addPathway()">+ Add Secondary Pathway</button>
    <button onclick="triggerPrint()">🖨️ Save as PDF / Print</button>
    <p style="font-size: 12px; color: #666;">Select a course to auto-fill the RRP. Campus and Timetable options will appear automatically for F2F pathways.</p>
</div>

<div class="page-container">
    <div class="content-wrapper">
        <div class="header">
            <div class="header-text">
                <h1>FIT COLLEGE</h1>
                <h2>Official Course Investment Quote</h2>
